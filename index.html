<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Atividades - Desenvolvimento Web 2</title>
</head>
<body>
  <h1>Atividades de JavaScript</h1>
  <p>Abrir Pelos  navegador (pressione) <strong>F12</strong> para ver os resultados.</p>

  <script>
    // - Avaliação de Risco de Crédito
    
    function avaliarRiscoDeCredito(rendaMensal, dividaAtual) {
      // Converte as strings recebidas para números decimais
      const renda = parseFloat(rendaMensal);
      const divida = parseFloat(dividaAtual);

      // Fórmula da Taxa de Endividamento
      const TE = (divida / renda) * 100;

      // Classificação conforme a tabela
      if (TE < 10) {
        return "Risco Baixo";
      } else if (TE < 30) {
        return "Risco Moderado";
      } else {
        return "Risco Alto";
      }
    }

    console.log("===== QUESTÃO 1 - Risco de Crédito =====");
    const rendaInput = prompt("Informe a renda mensal (R$): ");
    const dividaInput = prompt("Informe a dívida atual (R$): ");
    const classificacao = avaliarRiscoDeCredito(rendaInput, dividaInput);
    
    // Exibindo com Template Literals
    console.log(`Renda: R$ ${rendaInput} | Dívida: R$ ${dividaInput} → ${classificacao}`);

 
    // - Manipulação de array

    console.log("\n===== QUESTÃO 2 - Manipulação de Array =====");
    const numeros = [];
    let continuar = true;

    while (continuar) {
      // O prompt do navegador retorna null se o usuário clicar em Cancelar
      const entrada = prompt("Digite um número (ou cancele/clique em OK vazio para finalizar): ");
      
      if (entrada === null || entrada.trim() === "") {
        continuar = false;
      } else {
        const n = parseFloat(entrada);
        if (!isNaN(n)) {
          numeros.push(n);
        } else {
          console.log("⚠️ Valor inválido, tente novamente.");
        }
      }
    }

    if (numeros.length === 0) {
      console.log("Nenhum número foi informado.");
    } else {
      console.log(`Array digitado: [${numeros.join(", ")}]`);
      
      // a) Maior e menor
      console.log(`Maior valor: ${Math.max(...numeros)}`);
      console.log(`Menor valor: ${Math.min(...numeros)}`);

      // b) Dobro usando map()
      const dobro = numeros.map(n => n * 2);
      console.log(`Dobro de cada número: [${dobro.join(", ")}]`);

      // c) Maiores que 5 usando filter()
      const maioresQue5 = numeros.filter(n => n > 5);
      console.log(`Números maiores que 5: [${maioresQue5.join(", ")}]`);
    }

    // - Objeto literal "carro"

    console.log("\n===== QUESTÃO 3 - Objeto Carro =====");
    const carro = {
      marca: "Toyota",
      modelo: "Corolla",
      ano: 2020,
      exibirInfo() {
        console.log(`Marca: ${this.marca} | Modelo: ${this.modelo} | Ano: ${this.ano}`);
      }
    };

    // a) Chamar exibirInfo
    carro.exibirInfo();

    // b) Adicionar cor
    carro.cor = "Preto";

    // c) Atualizar ano
    carro.ano = 2025;

    // d) Exibir objeto completo
    console.log(carro);

  </script>
</body>
</html>
